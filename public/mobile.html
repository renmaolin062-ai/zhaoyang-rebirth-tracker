<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>赵皓阳 REBIRTH RPG OS｜手机复盘</title>
  <style>
    :root{color-scheme:dark;--bg:#050713;--line:rgba(255,255,255,.13);--ink:#f3f6ff;--muted:#99a5c2;--cyan:#7df9ff;--purple:#a979ff;--gold:#ffd37a;--green:#63f3a6;--red:#ff6b8a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% -10%,rgba(125,249,255,.24),transparent 34%),radial-gradient(circle at 86% 4%,rgba(169,121,255,.30),transparent 30%),linear-gradient(180deg,#050713 0%,#0b1025 48%,#060713 100%);color:var(--ink);font-family:Inter,"HarmonyOS Sans","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{width:min(100% - 24px,520px);margin:0 auto;padding:18px 0 92px}.hero,.card{border:1px solid var(--line);border-radius:26px;background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.045));box-shadow:0 24px 70px rgba(0,0,0,.36);backdrop-filter:blur(22px)}.hero{position:sticky;top:10px;z-index:5;overflow:hidden;padding:22px}.hero:after{content:"";position:absolute;width:150px;height:150px;right:-42px;top:-50px;border-radius:999px;background:radial-gradient(circle,rgba(255,211,122,.55),rgba(169,121,255,.18),transparent 70%);animation:pulse 4s ease-in-out infinite}@keyframes pulse{0%,100%{transform:scale(.9);opacity:.65}50%{transform:scale(1.1);opacity:1}}.pill{display:inline-flex;border:1px solid rgba(125,249,255,.28);border-radius:999px;padding:7px 10px;color:var(--cyan);background:rgba(125,249,255,.08);font-size:12px;font-weight:900;letter-spacing:.08em}h1,h2,p{margin:0}h1{position:relative;z-index:1;margin-top:16px;font-size:42px;line-height:1;background:linear-gradient(110deg,#fff,var(--gold) 48%,var(--purple));-webkit-background-clip:text;color:transparent}.hero p{position:relative;z-index:1;margin-top:10px;color:var(--muted);line-height:1.7}.stats{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:18px}.stats div,.line{border:1px solid var(--line);border-radius:18px;padding:12px;background:rgba(255,255,255,.055)}span.label,.stats span,.kicker{display:block;color:var(--muted);font-size:12px;font-weight:900;letter-spacing:.04em}.stats strong,.line strong{display:block;margin-top:5px;color:#fff;font-size:22px}.card{margin-top:14px;padding:18px}.card h2{margin:7px 0 14px;font-size:24px}.grid{display:grid;gap:10px}label.field{display:grid;gap:8px;margin-top:12px;color:var(--muted);font-weight:900}textarea,input[type=text]{width:100%;min-height:82px;border:1px solid var(--line);border-radius:18px;padding:13px;outline:none;resize:vertical;color:var(--ink);background:rgba(255,255,255,.07);font:inherit;line-height:1.65}input[type=range]{width:100%;accent-color:var(--gold)}.ledger-score{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}.ledger-score div{border:1px solid rgba(255,211,122,.2);border-radius:17px;padding:12px;background:rgba(255,211,122,.06)}.ledger-score strong{display:block;margin-top:5px;color:var(--gold);font-size:24px}.check-list{display:grid;gap:8px}.check{display:flex;align-items:center;gap:10px;min-height:46px;border:1px solid var(--line);border-radius:16px;padding:10px;background:rgba(255,255,255,.05);color:var(--muted);font-weight:800}.check input{width:20px;height:20px;accent-color:var(--gold)}.check em{margin-left:auto;color:var(--gold);font-style:normal;font-weight:900}.check:has(input:checked){color:var(--ink);border-color:rgba(255,211,122,.32);background:rgba(255,211,122,.08)}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.tabs button{border:1px solid var(--line);border-radius:999px;padding:11px;color:var(--muted);background:rgba(255,255,255,.05);font-weight:900}.tabs button.active{color:#1d1506;background:linear-gradient(135deg,var(--gold),#ff9f43)}.hidden{display:none}.toggle{display:flex;gap:10px;align-items:center;margin-top:12px;border:1px solid rgba(99,243,166,.22);border-radius:18px;padding:13px;background:rgba(99,243,166,.06);color:var(--green);font-weight:900}.toggle input{width:20px;height:20px;accent-color:var(--green)}.submit-bar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:12px max(12px,env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,rgba(5,7,19,.92) 24%)}.submit{display:block;width:min(100%,520px);margin:0 auto;border:0;border-radius:18px;padding:16px;color:#151007;background:linear-gradient(135deg,var(--gold),#ff9f43);box-shadow:0 16px 40px rgba(255,159,67,.26);font-size:17px;font-weight:1000}.notice{margin-top:12px;border:1px solid rgba(99,243,166,.24);border-radius:18px;padding:12px;color:var(--green);background:rgba(99,243,166,.08);font-weight:900}.error{margin-top:12px;border:1px solid rgba(255,107,138,.28);border-radius:18px;padding:12px;color:var(--red);background:rgba(255,107,138,.08);line-height:1.6}
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <span class="pill">REBIRTH RPG OS / CLOUD MOBILE</span>
      <h1>今晚结算</h1>
      <p id="dateLine">正在连接云端记录...</p>
      <div class="stats">
        <div><span>XP</span><strong id="xpToday">--</strong></div>
        <div><span>完成率</span><strong id="rateToday">--</strong></div>
        <div><span>净功</span><strong id="netMerit">--</strong></div>
      </div>
    </section>
    <div id="message"></div>
    <form id="reviewForm">
      <section class="card"><span class="kicker">AI ACADEMY</span><h2>AI 复盘</h2><label class="field">今日认知<textarea name="ai_cognition" placeholder="今天对AI/Python多理解了什么？"></textarea></label><label class="field">今日实操<textarea name="ai_practice" placeholder="今天动手做了什么？"></textarea></label><label class="field">今日输出成果<textarea name="ai_output" placeholder="产出了代码、笔记、想法还是作品？"></textarea></label></section>
      <section class="card"><span class="kicker">LIAO FAN LEDGER</span><h2>功过表｜每日修身</h2><div class="ledger-score"><div><span class="label">今日功</span><strong id="meritCount">+0</strong></div><div><span class="label">今日过</span><strong id="faultCount">-0</strong></div><div><span class="label">今日净功</span><strong id="netCount">0</strong></div><div><span class="label">累计净功</span><strong id="totalNet">0</strong></div></div><div class="tabs"><button type="button" class="active" data-tab="merits">今日功</button><button type="button" data-tab="faults">今日过</button></div><div id="merits" class="check-list"></div><div id="faults" class="check-list hidden"></div><label class="field">今天我最需要改的一件事是：<textarea name="improvement_needed"></textarea></label><label class="field">明天我准备怎么改：<textarea name="tomorrow_fix"></textarea></label></section>
      <section class="card"><span class="kicker">READING TREE</span><h2>阅读复盘</h2><label class="field">页数<textarea name="reading_pages" placeholder="例如：12页"></textarea></label><label class="field">一句最重要认知<textarea name="reading_insight" placeholder="不用漂亮，真实即可。"></textarea></label></section>
      <section class="card"><span class="kicker">BOSS SUMMARY</span><h2>Boss 战总结</h2><label class="field">今天最强动作<textarea name="strongest_action"></textarea></label><label class="field">今天最大卡点<textarea name="biggest_blocker"></textarea></label><label class="field">今天学到的最重要东西<textarea name="most_important_learning"></textarea></label><label class="field">明天第一步<textarea name="tomorrow_first_step"></textarea></label></section>
      <section class="card"><span class="kicker">REAL STATUS</span><h2>情绪区</h2><label class="field">今日状态打分：<b id="moodValue">7</b> / 10<input type="range" min="1" max="10" name="mood_score" value="7"></label><label class="field">今日一句真实感受<textarea name="real_feeling" placeholder="不要鸡汤。真实即可。"></textarea></label><label class="toggle"><input type="checkbox" name="minimum_version_done"> 今天完成最低版本了吗？</label><label class="field">今天最想感谢自己的1件事<textarea name="self_thanks"></textarea></label></section>
    </form>
  </main>
  <div class="submit-bar"><button class="submit" form="reviewForm" type="submit">保存今晚复盘</button></div>
  <script>
    const form=document.querySelector("#reviewForm"),message=document.querySelector("#message");function $(n){return form.elements[n]}function showMessage(t,c="notice"){message.innerHTML=`<div class="${c}">${t}</div>`}function setText(i,v){document.getElementById(i).textContent=v}function renderChecks(id,items,values,kind,mark){document.getElementById(id).innerHTML=items.map(([key,label])=>`<label class="check"><input type="checkbox" data-kind="${kind}" data-id="${key}" ${values?.[key]?"checked":""}><span>${label}</span><em>${mark}</em></label>`).join("")}function collectChecks(kind){return Object.fromEntries([...document.querySelectorAll(`input[data-kind="${kind}"]`)].map(i=>[i.dataset.id,i.checked]))}function updateLedgerNumbers(extra={}){const merits=collectChecks("merits"),faults=collectChecks("faults"),m=Object.values(merits).filter(Boolean).length,f=Object.values(faults).filter(Boolean).length,net=m-f;setText("meritCount",`+${m}`);setText("faultCount",`-${f}`);setText("netCount",net);setText("netMerit",net);if(extra.cumulative_net!==undefined)setText("totalNet",extra.cumulative_net)}function fillText(n,v){if($(n))$(n).value=v||""}
    async function loadReview(){const r=await fetch("/api/cloud-review"),data=await r.json();if(!data.ok)throw new Error(data.error||"云端读取失败");const review=data.record.night_review||{},table=data.record.merit_table||{};setText("dateLine",`${data.date} · 手机云端复盘，电脑关机也能写入记录。`);setText("xpToday",data.completion.xp_today);setText("rateToday",`${data.completion.rate}%`);setText("netMerit",data.merit.net);setText("totalNet",data.merit.cumulative_net);["ai_cognition","ai_practice","ai_output","reading_pages","reading_insight","strongest_action","biggest_blocker","most_important_learning","tomorrow_first_step","real_feeling","self_thanks"].forEach(n=>fillText(n,review[n]));$("mood_score").value=data.record.mood_score||7;setText("moodValue",$("mood_score").value);$("minimum_version_done").checked=Boolean(review.minimum_version_done);fillText("improvement_needed",table.improvement_needed);fillText("tomorrow_fix",table.tomorrow_fix);renderChecks("merits",data.meritItems,table.merits,"merits","+1");renderChecks("faults",data.faultItems,table.faults,"faults","-1");updateLedgerNumbers(data.merit)}
    document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".tabs button").forEach(i=>i.classList.remove("active"));b.classList.add("active");document.getElementById("merits").classList.toggle("hidden",b.dataset.tab!=="merits");document.getElementById("faults").classList.toggle("hidden",b.dataset.tab!=="faults")}));form.addEventListener("change",e=>{if(e.target.matches("[data-kind]"))updateLedgerNumbers();if(e.target.name==="mood_score")setText("moodValue",e.target.value)});form.addEventListener("submit",async e=>{e.preventDefault();showMessage("正在保存到云端...");const payload={ai_cognition:$("ai_cognition").value,ai_practice:$("ai_practice").value,ai_output:$("ai_output").value,reading_pages:$("reading_pages").value,reading_insight:$("reading_insight").value,strongest_action:$("strongest_action").value,biggest_blocker:$("biggest_blocker").value,most_important_learning:$("most_important_learning").value,tomorrow_first_step:$("tomorrow_first_step").value,real_feeling:$("real_feeling").value,self_thanks:$("self_thanks").value,mood_score:$("mood_score").value,minimum_version_done:$("minimum_version_done").checked,improvement_needed:$("improvement_needed").value,tomorrow_fix:$("tomorrow_fix").value,merits:collectChecks("merits"),faults:collectChecks("faults")};const r=await fetch("/api/cloud-review",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}),data=await r.json();if(!data.ok)throw new Error(data.error||"保存失败");setText("xpToday",data.completion.xp_today);setText("rateToday",`${data.completion.rate}%`);updateLedgerNumbers(data.merit);showMessage("已保存。今晚这场怪，结算完成。")});loadReview().catch(e=>showMessage(`云端复盘页暂时不可用：${e.message}`,"error"));
  </script>
</body>
</html>
